{% extends "base.html" %}
{% block content %}

<!-- Flatpickr CSS & JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
    .glass-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
    .table-header-custom th { background-color: #f8f9fc; color: #4e73df; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; padding: 15px 10px; border-bottom: 2px solid #e3e6f0; }
    .input-glass { border: 1px solid #d1d3e2; border-radius: 8px; padding: 8px 12px; background-color: #f8f9fc; transition: all 0.3s; }
    .input-glass:focus { background-color: #fff; border-color: #4e73df; box-shadow: 0 0 0 0.2rem rgba(78,115,223,0.1); }
    /* Hide number arrows (spinners) for clean UI */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
</style>

<div class="container-fluid py-4 fade-in-up">
    
    <!-- Header -->
    <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('purchases') }}" class="btn btn-light border rounded-circle me-3 shadow-sm">
            <i class="fa-solid fa-arrow-left text-secondary"></i>
        </a>
        <div>
            <h6 class="text-uppercase text-primary fw-bold small mb-1">Inbound Logistics</h6>
            <h3 class="fw-bold text-dark mb-0">Record New Purchase</h3>
        </div>
    </div>

    <form action="{{ url_for('new_purchase') }}" method="POST" id="purchaseForm">
        
        <!-- MASTER DETAILS CARD -->
        <div class="card glass-card mb-4">
            <div class="card-body p-4">
                <h6 class="fw-bold text-secondary mb-4 border-bottom pb-2"><i class="fa-solid fa-file-invoice me-2"></i>Invoice Details</h6>
                
                <div class="row g-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Supplier <span class="text-danger">*</span></label>
                        <select name="supplier_id" class="form-select input-glass fw-bold text-dark" required>
                            <option value="">-- Choose Supplier --</option>
                            {% for s in suppliers %}
                                <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold small text-muted text-uppercase">Purchase Date <span class="text-danger">*</span></label>
                        <input type="text" name="purchase_date" id="purchaseDate" class="form-control input-glass fw-bold text-dark" placeholder="dd-mm-yyyy" value="{{ today_date }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold small text-muted text-uppercase">Bill Number</label>
                        <input type="text" name="bill_number" class="form-control input-glass" placeholder="Auto-generated if empty">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-bold small text-muted text-uppercase">Notes / Remarks</label>
                        <input type="text" name="notes" class="form-control input-glass" placeholder="e.g., Includes Courier Charge & GST">
                    </div>
                </div>
            </div>
        </div>

        <!-- ITEMS TABLE CARD -->
        <div class="card glass-card mb-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle mb-0" id="purchaseTable">
                        <thead class="table-header-custom">
                            <tr>
                                <th class="text-center" style="width: 50px;">#</th>
                                <th>Product Details</th>
                                <th class="text-center" style="width: 150px;">Quantity</th>
                                <th class="text-center" style="width: 180px;">True Unit Cost (₹)</th>
                                <th class="text-end" style="width: 200px;">Total Amount (₹)</th>
                                <th class="text-center" style="width: 80px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="itemsBody">
                            <tr class="item-row">
                                <td class="text-center fw-bold text-muted row-index">1</td>
                                <td>
                                    <select name="product_id[]" class="form-select input-glass fw-bold text-dark" required>
                                        <option value="">-- Select Product --</option>
                                        {% for p in products %}
                                            <option value="{{ p.id }}">{{ p.name }}</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td>
                                    <input type="number" name="quantity[]" class="form-control input-glass text-center fw-bold input-qty" placeholder="0" min="1" step="1" onkeypress="return event.charCode >= 48 && event.charCode <= 57" required>
                                </td>
                                <td>
                                    <input type="number" name="price[]" class="form-control input-glass text-center fw-bold text-info input-price" placeholder="0" min="0" step="1" onkeypress="return event.charCode >= 48 && event.charCode <= 57" required>
                                </td>
                                <td>
                                    <input type="number" name="line_total[]" class="form-control input-glass text-end fw-bold text-primary input-total" placeholder="0" min="0" step="1" onkeypress="return event.charCode >= 48 && event.charCode <= 57" required>
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-light text-danger btn-sm rounded-circle btn-remove" disabled><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot class="bg-light">
                            <tr>
                                <td colspan="3">
                                    <button type="button" class="btn btn-sm btn-outline-primary fw-bold ms-2 rounded-pill px-3" id="addRowBtn">
                                        <i class="fa-solid fa-plus me-1"></i> Add Another Item
                                    </button>
                                </td>
                                <td class="text-end fw-bold text-muted text-uppercase pt-3">Grand Total :</td>
                                <td class="text-end pt-3 pe-3">
                                    <h4 class="fw-bold text-dark mb-0">₹ <span id="grandTotalDisplay">0</span></h4>
                                </td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end mb-5">
            <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow">
                <i class="fa-solid fa-check-circle me-2"></i> Confirm Purchase & Update Stock
            </button>
        </div>

    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    flatpickr("#purchaseDate", { dateFormat: "d-m-Y", allowInput: true });

    const tableBody = document.getElementById('itemsBody');
    const addRowBtn = document.getElementById('addRowBtn');
    const grandTotalDisplay = document.getElementById('grandTotalDisplay');

    const productsOptions = `
        <option value="">-- Select Product --</option>
        {% for p in products %}
            <option value="{{ p.id }}">{{ p.name|replace("'", "\\'") }}</option>
        {% endfor %}
    `;

    function updateRowIndexes() {
        const rows = tableBody.querySelectorAll('.item-row');
        rows.forEach((row, index) => {
            row.querySelector('.row-index').textContent = index + 1;
            const removeBtn = row.querySelector('.btn-remove');
            if (rows.length > 1) {
                removeBtn.removeAttribute('disabled');
                removeBtn.classList.remove('btn-light');
                removeBtn.classList.add('btn-outline-danger');
            } else {
                removeBtn.setAttribute('disabled', 'true');
                removeBtn.classList.add('btn-light');
                removeBtn.classList.remove('btn-outline-danger');
            }
        });
    }

    // BI-DIRECTIONAL CALCULATOR (STRICT WHOLE NUMBERS)
    function calculateRow(row, trigger) {
        const qtyInput = row.querySelector('.input-qty');
        const priceInput = row.querySelector('.input-price');
        const totalInput = row.querySelector('.input-total');

        const qty = parseInt(qtyInput.value, 10) || 0;
        let price = parseInt(priceInput.value, 10) || 0;
        let total = parseInt(totalInput.value, 10) || 0;

        if (trigger === 'total') {
            if (qty > 0) {
                priceInput.value = Math.round(total / qty);
            } else {
                priceInput.value = '0';
            }
        } else {
            totalInput.value = Math.round(qty * price);
        }

        calculateGrandTotal();
    }

    function calculateGrandTotal() {
        let grandTotal = 0;
        document.querySelectorAll('.input-total').forEach(input => {
            grandTotal += parseInt(input.value, 10) || 0;
        });
        grandTotalDisplay.textContent = grandTotal;
    }

    tableBody.addEventListener('input', function(e) {
        const row = e.target.closest('.item-row');
        if (e.target.classList.contains('input-total')) {
            calculateRow(row, 'total');
        } else if (e.target.classList.contains('input-price') || e.target.classList.contains('input-qty')) {
            calculateRow(row, 'price');
        }
    });

    tableBody.addEventListener('click', function(e) {
        if (e.target.closest('.btn-remove')) {
            const row = e.target.closest('.item-row');
            row.remove();
            updateRowIndexes();
            calculateGrandTotal();
        }
    });

    addRowBtn.addEventListener('click', function() {
        const tr = document.createElement('tr');
        tr.classList.add('item-row');
        tr.innerHTML = `
            <td class="text-center fw-bold text-muted row-index"></td>
            <td>
                <select name="product_id[]" class="form-select input-glass fw-bold text-dark" required>
                    ${productsOptions}
                </select>
            </td>
            <td><input type="number" name="quantity[]" class="form-control input-glass text-center fw-bold input-qty" placeholder="0" min="1" step="1" onkeypress="return event.charCode >= 48 && event.charCode <= 57" required></td>
            <td><input type="number" name="price[]" class="form-control input-glass text-center fw-bold text-info input-price" placeholder="0" min="0" step="1" onkeypress="return event.charCode >= 48 && event.charCode <= 57" required></td>
            <td><input type="number" name="line_total[]" class="form-control input-glass text-end fw-bold text-primary input-total" placeholder="0" min="0" step="1" onkeypress="return event.charCode >= 48 && event.charCode <= 57" required></td>
            <td class="text-center">
                <button type="button" class="btn btn-outline-danger btn-sm rounded-circle btn-remove"><i class="fa-solid fa-trash"></i></button>
            </td>
        `;
        tableBody.appendChild(tr);
        updateRowIndexes();
    });

    updateRowIndexes();
});
</script>
{% endblock %}
